name: 시간표 자동 업데이트

on:
  schedule:
    # Korea time: 11:00 and 15:00.  Comcigan can publish a new week's data
    # after 09:00 on Monday, so avoid capturing the previous week's payload.
    - cron: '0 2,6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timetable-update
  cancel-in-progress: false
  
jobs:
  update-timetable:
    runs-on: ubuntu-24.04
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 라이브러리 설치
        run: pip install --upgrade pycomcigan requests

      - name: 설치 버전 확인
        run: python -m pip show pycomcigan

      - name: 시간표 갱신 실행
        run: python make_html.py
        
      - name: 결과물 저장 (Commit & Push)
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

          git add index.html
          git commit -m "시간표 자동 업데이트 완료" || exit 0

          # 그사이 원격에 올라온 변경을 받아와서 내 커밋을 그 위에 얹기
          # index.html이 충돌하면 방금 만든 최신 시간표를 우선
          git pull --rebase -X theirs origin main
          git push
